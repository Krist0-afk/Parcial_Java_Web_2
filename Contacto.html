<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuertoGames | Contacto</title>
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen text-white p-8" style="background: radial-gradient(circle, rgba(48,48,122,1) 0%, rgba(129,96,143,1) 100%)">

  <!-- NAVBAR -->
  <nav class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        
        <span class="text-xl font-bold tracking-wide">PuertoGames</span>
      </div>
      <div class="hidden md:flex space-x-6 font-medium">
        <a href="index.html" class="hover:text-gray-300">Inicio</a>
        <a href="Producto.html" class="hover:text-gray-300">Videojuegos</a>
        <a href="Contacto.html" class="hover:text-gray-300">Contacto</a>
      </div>
    </div>
  </nav>

  <!--  CONTENIDO PRINCIPAL -->
  <main class="flex-grow p-4">
    <section class="text-center py-8">
      <h1 class="text-4xl font-extrabold text-white mb-4">Contáctanos 🎮</h1>
      <p class="text-white text-lg">¿Tienes alguna duda? ¡Escríbenos!</p>
    </section>

    <!--  FORMULARIO DE CONTACTO -->
    <section class="max-w-4xl mx-auto bg-green-500 rounded-xl shadow-xl p-10 text-gray-800">
      <h2 class="text-3xl font-extrabold text-center mb-8 text-indigo-700">Formulario de Contacto</h2>
      <form action="#" method="POST" class="space-y-6">
        <div class="flex flex-col">
          <label for="nombre" class="text-lg font-semibold">Nombre</label>
          <input type="text" id="nombre" name="nombre" required class="p-4 border border-gray-300 rounded-md text-lg">
        </div>
        <div class="flex flex-col">
          <label for="email" class="text-lg font-semibold">Correo Electrónico</label>
          <input type="email" id="email" name="email" required class="p-4 border border-gray-300 rounded-md text-lg">
        </div>
        <div class="flex flex-col">
          <label for="mensaje" class="text-lg font-semibold">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" required class="p-4 border border-gray-300 rounded-md text-lg"></textarea>
        </div>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition">
          Enviar Mensaje
        </button>
      </form>

    </section>
  </main>

  <!--  FOOTER -->
  <footer class="bg-indigo-700 text-white mt-12">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-sm font-semibold">PuertoGames © 2025</span>
      </div>
      <div class="flex space-x-4 text-sm">
        <a href="#" class="hover:underline">Términos</a>
        <a href="#" class="hover:underline">Privacidad</a>
        <a href="#" class="hover:underline">Soporte</a>
      </div>
    </div>
  </footer>

</body>
</html>
