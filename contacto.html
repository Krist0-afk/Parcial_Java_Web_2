<!--Gerardo Avila Contacto.-->

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuertoGames | Contacto</title>
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

  <!-- ✅ NAVBAR -->
  <nav class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="https://img.icons8.com/external-flatart-icons-outline-flatarticons/64/ffffff/external-gamepad-gaming-flatart-icons-outline-flatarticons.png" alt="Logo PuertoGames" class="w-8 h-8">
        <span class="text-xl font-bold tracking-wide">PuertoGames</span>
      </div>
      <div class="hidden md:flex space-x-6 font-medium">
        <a href="#" class="hover:text-gray-300">Inicio</a>
        <a href="#" class="hover:text-gray-300">Videojuegos</a>
        <a href="#contacto" class="hover:text-gray-300">Contacto</a>
      </div>
    </div>
  </nav>

  <!-- 🔻 CONTENIDO PRINCIPAL -->
  <main class="flex-grow p-4">
    <section class="text-center py-8">
      <h1 class="text-4xl font-extrabold text-gray-800 mb-4">Bienvenido a PuertoGames 🎮</h1>
      <p class="text-gray-600 text-lg">Explora y descubre tu próximo videojuego favorito.</p>
    </section>
  </main>

  <!-- 🎮 SECCIÓN DE JUEGOS -->
  <div class="flex flex-wrap justify-center gap-6 p-8 bg-gray-100 ">
    <!-- Cards de juegos -->
  </div>

  <!-- ✅ SECCIÓN DE CONTACTO CON MEJOR ALINEACIÓN -->
<section id="contacto" class="max-w-6xl mx-auto my-20 bg-white rounded-xl shadow-xl p-16">
    <h2 class="text-5xl font-extrabold text-indigo-700 text-center mb-12">Contáctanos</h2>
    <form action="#" method="POST" class="max-w-lg mx-auto space-y-6">
      <div class="flex flex-col">
        <label for="nombre" class="text-lg font-semibold text-gray-700">Nombre</label>
        <input type="text" id="nombre" name="nombre" required class="w-full p-4 border border-gray-300 rounded-md text-lg">
      </div>
      <div class="flex flex-col">
        <label for="email" class="text-lg font-semibold text-gray-700">Correo Electrónico</label>
        <input type="email" id="email" name="email" required class="w-full p-4 border border-gray-300 rounded-md text-lg">
      </div>
      <div class="flex flex-col">
        <label for="mensaje" class="text-lg font-semibold text-gray-700">Mensaje</label>
        <textarea id="mensaje" name="mensaje" required class="w-full p-4 border border-gray-300 rounded-md text-lg"></textarea>
      </div>
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-800 text-white font-bold text-xl py-4 px-12 rounded-md shadow-lg transition duration-300 mt-8 w-full max-w-md mx-auto">
        Enviar Mensaje
      </button>
    </form>
  
<!-- 🔹 BOTÓN DE VOLVER AL INICIO -->
<a href="PuertoGames.html" class="bg-indigo-600 hover:bg-indigo-800 text-white font-bold text-xl py-4 px-12 rounded-md shadow-lg transition duration-300 mt-12 w-full max-w-md mx-auto text-center block">
    Volver al Inicio
  </a>
  
  </section>
  

  <!-- ✅ FOOTER -->
  <footer class="bg-indigo-700 text-white mt-12">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <img src="https://img.icons8.com/external-flatart-icons-outline-flatarticons/64/ffffff/external-gamepad-gaming-flatart-icons-outline-flatarticons.png" alt="Logo PuertoGames" class="w-6 h-6">
        <span class="text-sm font-semibold">PuertoGames © 2025</span>
      </div>
      <div class="flex space-x-4 text-sm">
        <a href="#" class="hover:underline">Términos</a>
        <a href="#" class="hover:underline">Privacidad</a>
        <a href="#" class="hover:underline">Soporte</a>
      </div>
    </div>
  </footer>

</body>
</html>
